name: Build APK from ZIP
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip and locate project
        id: find
        run: |
          set -e
          mkdir -p /tmp/proj
          Z=$(find . -maxdepth 3 -iname '*.zip' -not -path './.git/*' | head -1)
          if [ -n "$Z" ]; then
            echo "Unzipping: $Z"
            unzip -q -o "$Z" -d /tmp/proj
            SRC=/tmp/proj
          else
            SRC="$PWD"
          fi
          S=$(find "$SRC" -maxdepth 4 \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/.git/*' | head -1)
          if [ -z "$S" ]; then
            echo "settings.gradle not found"
            exit 1
          fi
          DIR="$(cd "$(dirname "$S")" && pwd)"
          echo "Project dir: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Prepare Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > "${{ steps.find.outputs.dir }}/local.properties"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: Show only the errors
        if: failure()
        shell: bash
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          grep -E "^e: " build.log | head -40 || true
          grep -A6 "What went wrong" build.log | head -30 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SwarmDeck-APK
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
