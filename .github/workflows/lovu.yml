name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install platform + build-tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare project
        run: |
          if ls *.zip 1>/dev/null 2>&1; then
            unzip -o *.zip -d extracted
            if [ -d extracted/SwarmDeck ]; then cp -a extracted/SwarmDeck/. .; else cp -a extracted/. .; fi
            rm -rf extracted
          fi
          ls -la
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SwarmDeck-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
