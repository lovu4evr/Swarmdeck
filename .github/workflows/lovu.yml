name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Unzip project if needed
        run: |
          # Agar zip root mein hai to extract karo
          if ls *.zip 1> /dev/null 2>&1; then
            echo "Zip found → extracting..."
            unzip -o *.zip -d extracted
            # SwarmDeck folder ke andar project hai to usko root pe lao
            if [ -d extracted/SwarmDeck ]; then
              cp -a extracted/SwarmDeck/. .
            else
              cp -a extracted/. .
            fi
            rm -rf extracted
          fi
          echo "Project files:"
          ls -la
          test -f app/build.gradle.kts || (echo "ERROR: app/build.gradle.kts not found" && exit 1)

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SwarmDeck-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
