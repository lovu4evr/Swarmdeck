
name: SwarmDeck Android Build

on:
  push:
    branches:
      - main
    paths:
      - 'SwarmDeck_V4.0.zip'
      - '.github/workflows/android-build.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SwarmDeck APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify ZIP
        run: |
          test -f SwarmDeck_V4.0.zip
          unzip -t SwarmDeck_V4.0.zip

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q SwarmDeck_V4.0.zip -d extracted
          ls -la extracted/SwarmDeck

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: extracted/SwarmDeck
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SwarmDeck-V4-Debug-APK
          path: extracted/SwarmDeck/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
