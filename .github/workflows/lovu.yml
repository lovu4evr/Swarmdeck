name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Gradle project
        id: p
        run: |
          F=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then
            echo "settings.gradle.kts NOT FOUND"
            find . -maxdepth 3 -not -path './.git/*' | head -40
            exit 1
          fi
          echo "dir=$(dirname "$F")" >> "$GITHUB_OUTPUT"
          echo "Found project at: $(dirname "$F")"

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: |
          gradle assembleDebug --no-daemon \
            -PGOOGLE_WEB_CLIENT_ID="${{ secrets.GOOGLE_WEB_CLIENT_ID }}"

      - name: Rename APK
        run: |
          cp "${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk" SwarmDeck-GodMode.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwarmDeck-GodMode-APK
          path: SwarmDeck-GodMode.apk
          retention-days: 14

      - name: Attach to GitHub Release (only on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SwarmDeck-GodMode.apk
