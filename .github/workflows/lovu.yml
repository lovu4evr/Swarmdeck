name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Find project (root / subfolder / zip)
        id: find
        run: |
          set -e
          DIR=""
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            DIR="$PWD"
          else
            S=$(find . -maxdepth 4 \( -name settings.gradle.kts -o -name settings.gradle \) -not -path './.git/*' | head -1)
            if [ -n "$S" ]; then
              DIR="$(cd "$(dirname "$S")" && pwd)"
            else
              Z=$(find . -maxdepth 3 -iname '*.zip' -not -path './.git/*' | head -1)
              if [ -z "$Z" ]; then echo "No project or zip found in repo"; exit 1; fi
              echo "Unzipping $Z"
              mkdir -p /tmp/proj
              unzip -q -o "$Z" -d /tmp/proj
              S=$(find /tmp/proj \( -name settings.gradle.kts -o -name settings.gradle \) | head -1)
              if [ -z "$S" ]; then echo "settings.gradle not found inside zip"; exit 1; fi
              DIR="$(cd "$(dirname "$S")" && pwd)"
            fi
          fi
          echo "Project dir: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Prepare Android SDK (preinstalled on runner)
        run: |
          echo "sdk.dir=$ANDROID_HOME" > "${{ steps.find.outputs.dir }}/local.properties"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Unit tests (non-blocking)
        continue-on-error: true
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle testDebugUnitTest --no-daemon

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SwarmDeck-APK
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build reports (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: ${{ steps.find.outputs.dir }}/app/build/reports
          if-no-files-found: ignore
