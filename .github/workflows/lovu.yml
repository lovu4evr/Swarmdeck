name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip project if needed
        run: |
          echo "=== Current files ==="
          ls -la
          echo ""

          # If settings.gradle.kts already exists, do nothing
          if [ -f settings.gradle.kts ] || [ -f */settings.gradle.kts ]; then
            echo "Gradle project already present"
            exit 0
          fi

          # Look for any zip file
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -1)
          if [ -n "$ZIP" ]; then
            echo "Found ZIP: $ZIP — extracting..."
            unzip -oq "$ZIP"
            echo "=== After unzip ==="
            ls -la
          else
            echo "No ZIP found and no settings.gradle.kts"
            find . -maxdepth 3 -not -path './.git/*'
            exit 1
          fi

      - name: Find Gradle project
        id: p
        run: |
          F=$(find . -name "settings.gradle.kts" -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then
            echo "settings.gradle.kts still NOT FOUND after unzip"
            find . -maxdepth 4 -not -path './.git/*' | head -50
            exit 1
          fi
          DIR=$(dirname "$F")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Found project at: $DIR"

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: |
          gradle assembleDebug --no-daemon \
            -PGOOGLE_WEB_CLIENT_ID="${{ secrets.GOOGLE_WEB_CLIENT_ID }}"

      - name: Rename APK
        run: |
          cp "${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk" SwarmDeck-GodMode.apk
          ls -lh SwarmDeck-GodMode.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwarmDeck-GodMode-APK
          path: SwarmDeck-GodMode.apk
          retention-days: 14

      - name: Attach to GitHub Release (only on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SwarmDeck-GodMode.apk
