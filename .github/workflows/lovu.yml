name: Build APK from ZIP

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ZIP repo me kahin bhi ho (root ya subfolder) – yeh khud dhundh ke unzip karega
      - name: Unzip project
        id: find
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/proj
          Z=$(find . -maxdepth 3 -iname '*.zip' -not -path './.git/*' | head -1)
          if [ -n "$Z" ]; then
            echo "Found zip: $Z"
            unzip -q -o "$Z" -d /tmp/proj
            SEARCH=/tmp/proj
          else
            echo "Zip nahi mila, repo ko hi project maan raha hu"
            SEARCH=.
          fi
          S=$(find "$SEARCH" -maxdepth 4 \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/.git/*' | head -1)
          if [ -z "$S" ]; then echo "settings.gradle nahi mila"; exit 1; fi
          DIR="$(cd "$(dirname "$S")" && pwd)"
          echo "Project dir: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Android SDK setup
        shell: bash
        run: |
          echo "sdk.dir=$ANDROID_HOME" > "${{ steps.find.outputs.dir }}/local.properties"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: Show errors (only on failure)
        if: failure()
        shell: bash
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          echo "=== KOTLIN ERRORS ==="
          grep -E "^e: " build.log | head -40 || true
          echo "=== WHAT WENT WRONG ==="
          grep -A6 "What went wrong" build.log | head -30 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SwarmDeck-APK
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build reports (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: ${{ steps.find.outputs.dir }}/app/build/reports
          if-no-files-found: ignore
